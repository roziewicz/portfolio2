name: Deploy Portfolio to MyDevil

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SFTP
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: s86.mydevil.net
          REMOTE_USER: paniedzieju
          TARGET: /home/paniedzieju/domains/roziewicz.com/public_html/